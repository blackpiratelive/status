
<h1 class="main-heading">{{ .Site.Title }}</h1>

<div class="nav-bar">
    <div class="nav-item nav-home"><a href="https://blackpiratex.com">Home</a></div>
    <div class="nav-item nav-contact"><a href="https://blackpiratex.com/contact">Contact</a></div>
    <div class="nav-item nav-about"><a href="https://blackpiratex.com/about">About</a></div>
    <div class="nav-item nav-blog"><a href="https://blog.blackpiratex.com">Blog</a></div>
    <div class="nav-item nav-gallery"><a href="https://gallery.blackpiratex.com">Gallery</a></div>
    <div class="nav-item nav-status"><a href="/">Status</a></div>
</div>
<div class="buttons">
<button onclick="openPopup()" class="buttons">Change Theme</button>
</div>
<div id="popup" class="popup">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">Close</span>
    <h2>Themes</h2>
    <p>Click on the color below to choose a theme</p>
    <div class="theme-buttons">
            <button onclick="myfunctionPurple()" class="theme-btn btn-purple"></button>
        <button onclick="myfunctionGreen()" class="theme-btn btn-green"></button>
        <button onclick="myfunctionRed()" class="theme-btn btn-red"></button>
        <button onclick="myfunctionWhite()" class="theme-btn btn-white"></button>
        <button onclick="myfunctionCyan()" class="theme-btn btn-cyan"></button>
        <button onclick="myfunctionYellow()" class="theme-btn btn-yellow"></button>
    </div>
  </div>

</div>
<script>
function openPopup() {
  document.getElementById("popup").style.display = "block";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>
