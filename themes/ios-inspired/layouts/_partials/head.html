<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/stats.css">

<script>
    // This script runs instantly, before the page body renders.
    // It reads theme settings from cookies and applies them to prevent any "flash".
    (function() {
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        const docElement = document.documentElement;
        
        // Apply Dark/Light Mode
        const savedTheme = getCookie('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            docElement.classList.add('dark-mode');
        }

        // Apply Accent Color
        const savedAccent = getCookie('accentColor');
        if (savedAccent) {
            docElement.classList.add(`accent-${savedAccent}`);
        }
    })();
</script>
