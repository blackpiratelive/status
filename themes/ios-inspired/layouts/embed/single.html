<!DOCTYPE html>
<html lang="en">
<head>
    {{ partial "head.html" . }}
    <style>
        /* --- Minimal Embed Styles --- */
        body {
            background-color: transparent !important;
            padding: 0;
            margin: 0;
            font-size: 14px;
        }
        .embed-container {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }
        .embed-header, .embed-footer {
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e5e5e5;
        }
        .embed-header h3 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
        }
        .log-entry {
            padding: 1rem;
            border-bottom: 1px solid #e5e5e5;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry-meta {
            font-size: 0.75rem;
            color: #65676b;
            margin-bottom: 0.5rem;
        }
        .log-entry-content {
            line-height: 1.6;
        }
        .log-entry-content p {
            margin: 0;
        }
        .embed-footer {
            border-top: 1px solid #e5e5e5;
            border-bottom: none;
            text-align: center;
        }
        .embed-footer a {
            font-size: 0.875rem;
            color: #007aff;
            text-decoration: none;
            font-weight: 500;
        }
        .embed-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="embed-container">
        <div class="embed-header">
            <h3>Latest Status Updates</h3>
        </div>

        <!-- Log Entries -->
        <div class="log-entries">
            {{ range first 5 .Site.RegularPages.ByDate.Reverse }}
            <div class="log-entry">
                <div class="log-entry-meta">
                    <time>{{ .Date.Format "02 Jan 2006, 15:04 IST" }}</time>
                </div>
                <div class="log-entry-content">
                    {{ .Content }}
                </div>
            </div>
            {{ end }}
        </div>
        <div class="embed-footer">
            <a href="{{ .Site.BaseURL }}" target="_blank">View all updates &rarr;</a>
        </div>
    </div>

    <script>
        // This script sends the height of the content to the parent page
        const container = document.querySelector('.embed-container');
        const sendHeight = () => {
            if (container) {
                const height = container.offsetHeight;
                window.parent.postMessage({ frameHeight: height, source: 'hugo-embed' }, '*');
            }
        };
        window.onload = sendHeight;
        const resizeObserver = new ResizeObserver(sendHeight);
        if(container) {
            resizeObserver.observe(container);
        }
    </script>

</body>
</html>
