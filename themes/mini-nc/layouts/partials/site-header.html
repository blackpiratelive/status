<header>
    <a href="{{ .Site.BaseURL }}" class="site-title">{{ .Site.Title }}</a>
    <div class="header-controls">
         <div id="accent-picker-popup" class="accent-picker-popup">
            <div class="accent-picker">
                <button class="color-dot" data-color="green" title="Green"></button>
                <button class="color-dot" data-color="blue" title="Blue"></button>
                <button class="color-dot" data-color="purple" title="Purple"></button>
                <button class="color-dot" data-color="red" title="Red"></button>
                <button class="color-dot" data-color="orange" title="Orange"></button>
                <button class="color-dot" data-color="yellow" title="Yellow"></button>
                <button class="color-dot" data-color="white" title="White"></button>
            </div>
        </div>
        <button id="accent-toggle" title="Change accent color">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0L12 2.69z"></path></svg>
        </button>
        <button id="theme-toggle" title="Toggle theme">
            <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg id="moon-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>
</header>

<script>
    // This script is self-contained and manages both themes.
    document.addEventListener('DOMContentLoaded', () => {
        const docElement = document.documentElement;

        // --- THEME (LIGHT/DARK) TOGGLE SCRIPT ---
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');

        const applyTheme = (theme) => {
            if (theme === 'dark') {
                docElement.classList.add('dark-mode');
                if(sunIcon && moonIcon) {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'block';
                }
            } else {
                docElement.classList.remove('dark-mode');
                 if(sunIcon && moonIcon) {
                    sunIcon.style.display = 'block';
                    moonIcon.style.display = 'none';
                }
            }
        };

        if (savedTheme) { applyTheme(savedTheme); } 
        else if (userPrefersDark) { applyTheme('dark'); } 
        else { applyTheme('light'); }

        if(themeToggle) {
            themeToggle.addEventListener('click', () => {
                const newTheme = docElement.classList.contains('dark-mode') ? 'light' : 'dark';
                applyTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // --- ACCENT COLOR CHANGER SCRIPT ---
        const accentToggle = document.getElementById('accent-toggle');
        const accentPopup = document.getElementById('accent-picker-popup');
        const colorDots = document.querySelectorAll('.color-dot');
        const savedAccent = localStorage.getItem('accentColor');

        const applyAccent = (color) => {
            const accents = ['red', 'orange', 'yellow', 'green', 'purple', 'white', 'blue'];
            accents.forEach(a => docElement.classList.remove(`accent-${a}`));
            if (color && color !== 'green') { // Green is default, no class needed
                docElement.classList.add(`accent-${color}`);
            }

            if(colorDots) {
                colorDots.forEach(dot => {
                    dot.classList.toggle('active', dot.dataset.color === (color || 'green'));
                });
            }
        };

        if(savedAccent) {
            applyAccent(savedAccent);
        } else {
            applyAccent('green'); // Set default active dot
        }

        if(colorDots) {
            colorDots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const newAccent = dot.dataset.color;
                    applyAccent(newAccent);
                    localStorage.setItem('accentColor', newAccent);
                    if(accentPopup) {
                        accentPopup.classList.remove('open');
                    }
                });
            });
        }
        
        if(accentToggle && accentPopup) {
            accentToggle.addEventListener('click', (event) => {
                event.stopPropagation();
                accentPopup.classList.toggle('open');
            });
        }

        document.addEventListener('click', (event) => {
            if (accentPopup && accentToggle && !accentPopup.contains(event.target) && !accentToggle.contains(event.target)) {
                accentPopup.classList.remove('open');
            }
        });
    });
</script>
