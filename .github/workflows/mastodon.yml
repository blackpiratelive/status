# .github/workflows/mastodon.yml

name: Trigger Mastodon Post

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  trigger_mastodon_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Deployment and Trigger Mastodon Post
        id: mastodon_post
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
        run: |
          echo "Initial 3-minute wait for Vercel deployment to propagate..."
          sleep 180
          
          echo "Polling deployment at $VERCEL_URL to be ready..."
          
          end_time=$(( $(date +%s) + 180 ))
          
          while [ $(date +%s) -lt $end_time ]; do
            response=$(curl -L -s -w "
%{http_code}" -X POST "$VERCEL_URL/api/post-to-mastodon")
            
            status_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n -1)
            
            if [ "$status_code" = "200" ]; then
              echo "Successfully triggered Mastodon post! (Status: $status_code)"
              echo "Response: $body"
              
              echo "$body" > mastodon_response.json
              exit 0
            else
              echo "Deployment not ready yet (Status: $status_code). Retrying in 15 seconds..."
              sleep 15
            fi
          done
          
          echo "Error: Could not get a successful response from the API after 3 minutes."
          exit 1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Frontmatter with Mastodon Info
        run: |
          MASTODON_ID=$(jq -r '.id' mastodon_response.json)
          MASTODON_URL=$(jq -r '.url' mastodon_response.json)
          POST_PATH=$(jq -r '.post_path' mastodon_response.json)
          MASTODON_HOST=$(jq -r '.mastodon_host' mastodon_response.json)
          MASTODON_USERNAME=$(jq -r '.mastodon_username' mastodon_response.json)
          
          echo "Updating $POST_PATH with Mastodon ID: $MASTODON_ID"
          
          yq eval -i --front-matter="process" ".mastodon.id = "$MASTODON_ID"" "$POST_PATH"
          yq eval -i --front-matter="process" ".mastodon.host = "$MASTODON_HOST"" "$POST_PATH"
          yq eval -i --front-matter="process" ".mastodon.username = "$MASTODON_USERNAME"" "$POST_PATH"
          yq eval -i --front-matter="process" ".mastodon.url = "$MASTODON_URL"" "$POST_PATH"
          
          echo "Frontmatter updated successfully!"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add Mastodon post ID to frontmatter [skip ci]"
          file_pattern: "content/**/*.md"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"