name: Trigger Mastodon Post

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  trigger_mastodon_post:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Wait for Deployment to Propagate
        run: |
          echo "Waiting for Vercel deployment to propagate (3 minutes)..."
          sleep 60

      - name: Trigger Mastodon Post API
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
        run: |
          echo "Calling API: $VERCEL_URL/api/post-to-mastodon"

          response=$(curl -s -L -X POST "$VERCEL_URL/api/post-to-mastodon")

          echo "Response received:"
          echo "$response"

          # Validate basic fields
          guid=$(echo "$response" | jq -r '.guid // empty')
          mastodon_url=$(echo "$response" | jq -r '.mastodon_url // empty')
          success=$(echo "$response" | jq -r '.success // empty')
          already=$(echo "$response" | jq -r '.alreadyPosted // empty')

          # Stop if API failed
          if [ -z "$guid" ]; then
            echo "❌ Error: Missing GUID in response. Response was:"
            echo "$response"
            exit 1
          fi

          if [ "$already" = "true" ]; then
            echo "ℹ️ Already posted to Mastodon. No update needed."
            exit 0
          fi

          if [ "$success" != "true" ]; then
            echo "❌ Mastodon post failed. Response:"
            echo "$response"
            exit 1
          fi

          echo "✔ GUID: $guid"
          echo "✔ Mastodon URL: $mastodon_url"

          if [ -z "$mastodon_url" ] || [ "$mastodon_url" = "null" ]; then
            echo "❌ Error: mastodon_url missing in response."
            exit 1
          fi

          echo "guid=$guid" >> $GITHUB_ENV
          echo "mastodon_url=$mastodon_url" >> $GITHUB_ENV

      - name: Update Turso Database With Mastodon URL
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
          guid: ${{ env.guid }}
          mastodon_url: ${{ env.mastodon_url }}
        run: |
          echo "Updating DB..."
          echo "GUID: $guid"
          echo "Mastodon URL: $mastodon_url"

          update_response=$(curl -s -L -X POST "$VERCEL_URL/api/update-mastodon-url" \
            -H "Content-Type: application/json" \
            -d "{\"guid\":\"$guid\",\"mastodon_url\":\"$mastodon_url\"}")

          echo "DB Update Response:"
          echo "$update_response"

          success=$(echo "$update_response" | jq -r '.success // empty')

          if [ "$success" != "true" ]; then
            echo "❌ Failed to update DB."
            exit 1
          fi

          echo "✔ Turso DB successfully updated with Mastodon URL!"
