# .github/workflows/mastodon.yml

name: Trigger Mastodon Post

on:
  # Trigger on pushes to the main branch
  push:
    branches:
      - master # Or master, or your main production branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  trigger_mastodon_post:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Deployment and Trigger Mastodon Post
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
        run: |
          echo "Initial 1-minute wait for Vercel deployment to propagate..."
          sleep 180
          
          echo "Polling deployment at $VERCEL_URL to be ready..."
          
          # We will try to contact the API endpoint for 3 minutes.
          # The workflow will retry every 15 seconds until it gets a successful (2xx) response.
          end_time=$(( $(date +%s) + 180 )) # 3 minutes from now
          
          while [ $(date +%s) -lt $end_time ]; do
            # Use curl to check the HTTP status code of the POST request.
            # -L (follow redirects), -s (silent), -o /dev/null (discard output), -w "%{http_code}" (print status code)
            status_code=$(curl -L -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_URL/api/post-to-mastodon")
            
            if [ "$status_code" -eq 200 ]; then
              echo "Successfully triggered Mastodon post! (Received Status: $status_code)"
              exit 0
            else
              echo "Deployment not ready yet (Received Status: $status_code). Retrying in 15 seconds..."
              sleep 15
            fi
          done
          
          echo "Error: Could not get a successful response from the API after 3 minutes."
          exit 1
        shell: bash
